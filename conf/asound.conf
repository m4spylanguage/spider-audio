# 🕷️ Spider Audio - Direct Mixing & Duplex ALSA Configuration
# Zero Daemons | Bit-Perfect | Permissive Shared Memory | Ultra-Low Latency

pcm.!default {
    type asym
    playback.pcm "playback"
    capture.pcm "capture"
}

pcm.playback {
    type plug
    slave.pcm "dmixer"
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        rate 44100
        channels 2
        period_size 1024
        buffer_size 4096
    }
    bindings {
        0 0
        1 1
    }
}

pcm.capture {
    type plug
    slave.pcm "dsnooper"
}

pcm.dsnooper {
    type dsnoop
    ipc_key 2048
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        rate 44100
        channels 2
    }
}

ctl.!default {
    type hw
    card 0
}
